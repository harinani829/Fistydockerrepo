<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 CineVerse | Book Movie Tickets</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(145deg, #0b0f1c 0%, #1a1f2f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .booking-card {
      max-width: 1100px;
      width: 100%;
      background: rgba(22, 28, 45, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 2.5rem;
      padding: 2rem 2rem 2.2rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 215, 0, 0.1) inset;
      transition: all 0.3s ease;
    }

    h1 {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
    }

    h1 i {
      color: #ffd966;
      font-size: 2rem;
      filter: drop-shadow(0 0 8px #ffb347);
    }

    .subhead {
      color: #a0aec0;
      font-size: 0.95rem;
      font-weight: 400;
      margin-bottom: 2rem;
      border-left: 3px solid #ffd966;
      padding-left: 0.9rem;
      letter-spacing: 0.3px;
    }

    /* movie row */
    .movie-showcase {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 2rem;
      padding: 1rem 1.5rem;
      margin-bottom: 1.8rem;
      border: 1px solid rgba(255, 215, 0, 0.2);
      box-shadow: 0 8px 18px -6px rgba(0, 0, 0, 0.6);
      transition: 0.2s;
    }

    .movie-showcase:hover {
      border-color: rgba(255, 215, 0, 0.5);
      background: rgba(255, 255, 255, 0.05);
    }

    .poster {
      width: 65px;
      height: 65px;
      background: linear-gradient(135deg, #2b2f4a, #151a2b);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      border: 2px solid #ffd966;
      box-shadow: 0 0 14px rgba(255, 215, 0, 0.4);
      color: #ffd966;
    }

    .movie-info {
      flex: 1;
    }

    .movie-info h2 {
      color: white;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
      letter-spacing: -0.3px;
    }

    .movie-meta {
      display: flex;
      gap: 1.2rem;
      color: #a0aec0;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .movie-meta i {
      color: #ffd966;
      margin-right: 0.3rem;
      width: 0.9rem;
    }

    .rating-badge {
      background: #ffd966;
      color: #0b0f1c;
      padding: 0.3rem 0.9rem;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 0 12px #ffd96666;
    }

    /* date & time selectors */
    .section-title {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #a0aec0;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title i {
      color: #ffd966;
    }

    .date-scroll, .time-scroll {
      display: flex;
      gap: 0.75rem;
      overflow-x: auto;
      padding: 0.3rem 0.1rem 0.8rem;
      scrollbar-width: thin;
      scrollbar-color: #ffd966 #1e2538;
    }

    .date-scroll::-webkit-scrollbar, .time-scroll::-webkit-scrollbar {
      height: 4px;
    }

    .date-scroll::-webkit-scrollbar-thumb, .time-scroll::-webkit-scrollbar-thumb {
      background: #ffd966;
      border-radius: 10px;
    }

    .date-card {
      min-width: 95px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #2d3448;
      border-radius: 1.5rem;
      padding: 0.75rem 0.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      color: #cbd5e0;
      font-weight: 500;
    }

    .date-card .weekday {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #a0aec0;
      margin-bottom: 0.15rem;
    }

    .date-card .day {
      font-size: 1.3rem;
      font-weight: 700;
      color: #fff;
      line-height: 1.3;
    }

    .date-card .month {
      font-size: 0.7rem;
      color: #a0aec0;
    }

    .date-card.active {
      background: #ffd966;
      border-color: #ffd966;
      color: #0b0f1c;
      box-shadow: 0 0 20px #ffd96680;
      transform: scale(1.02);
    }

    .date-card.active .weekday,
    .date-card.active .day,
    .date-card.active .month {
      color: #0b0f1c;
    }

    .time-card {
      min-width: 80px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #2d3448;
      border-radius: 2rem;
      padding: 0.6rem 0.2rem;
      text-align: center;
      font-weight: 600;
      font-size: 0.95rem;
      color: #e2e8f0;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .time-card i {
      font-size: 0.7rem;
      color: #ffd966;
      margin-right: 0.2rem;
    }

    .time-card.active {
      background: #ffd966;
      border-color: #ffd966;
      color: #0b0f1c;
      box-shadow: 0 0 18px #ffd96680;
    }

    .time-card.active i {
      color: #0b0f1c;
    }

    /* screen and seats */
    .screen-area {
      margin: 1.5rem 0 1rem;
      text-align: center;
    }

    .screen {
      background: linear-gradient(90deg, #2d3448, #4a5568, #2d3448);
      height: 12px;
      width: 70%;
      margin: 0 auto 0.6rem;
      border-radius: 50% 50% 20% 20% / 100% 100% 0 0;
      box-shadow: 0 -6px 20px #ffd96640, 0 0 15px #ffffff20;
      transform: perspective(400px) rotateX(5deg);
      border-bottom: 2px solid #ffd966;
    }

    .screen-label {
      color: #a0aec0;
      font-size: 0.75rem;
      letter-spacing: 4px;
      font-weight: 500;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
    }

    .seats-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 1.8rem;
    }

    .seat-row {
      display: flex;
      gap: 0.7rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .seat {
      width: 2.1rem;
      height: 2.1rem;
      background: #1e2538;
      border-radius: 12px 12px 6px 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
      color: #8a94a8;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid #2d3448;
      box-shadow: 0 3px 0 #0b0f1c;
      user-select: none;
    }

    .seat i {
      font-size: 0.8rem;
      opacity: 0.5;
    }

    .seat.available:hover {
      background: #2d3b5a;
      border-color: #ffd966;
      transform: translateY(-2px);
      box-shadow: 0 5px 0 #0b0f1c;
    }

    .seat.selected {
      background: #ffd966;
      border-color: #ffd966;
      color: #0b0f1c;
      box-shadow: 0 3px 0 #b38f2e, 0 0 15px #ffd966aa;
      transform: scale(1.02);
    }

    .seat.selected i {
      color: #0b0f1c;
      opacity: 1;
    }

    .seat.occupied {
      background: #2a1f2e;
      border-color: #4a2e3a;
      color: #5a4a55;
      cursor: not-allowed;
      box-shadow: 0 3px 0 #0f0b10;
      opacity: 0.6;
    }

    .seat.occupied i {
      color: #5a4a55;
    }

    /* legend */
    .legend {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin: 0.5rem 0 1.5rem;
      font-size: 0.75rem;
      color: #a0aec0;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .legend-box {
      width: 1.1rem;
      height: 1.1rem;
      border-radius: 6px 6px 3px 3px;
    }

    .legend-box.available {
      background: #1e2538;
      border: 1px solid #2d3448;
    }

    .legend-box.selected {
      background: #ffd966;
      box-shadow: 0 0 8px #ffd966;
    }

    .legend-box.occupied {
      background: #2a1f2e;
      border: 1px solid #4a2e3a;
      opacity: 0.6;
    }

    /* summary & button */
    .booking-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 2rem;
      padding: 1rem 1.5rem;
      border: 1px solid #2d3448;
      margin-top: 0.8rem;
    }

    .summary {
      display: flex;
      align-items: center;
      gap: 1.8rem;
      flex-wrap: wrap;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
    }

    .summary-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #a0aec0;
      letter-spacing: 0.8px;
      font-weight: 500;
    }

    .summary-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: white;
    }

    .summary-value span {
      color: #ffd966;
      font-size: 0.9rem;
      font-weight: 500;
    }

    .book-btn {
      background: #ffd966;
      border: none;
      padding: 0.9rem 2.2rem;
      border-radius: 3rem;
      font-weight: 700;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      color: #0b0f1c;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 0 #b38f2e, 0 0 25px #ffd966aa;
      letter-spacing: 0.3px;
      border: 1px solid #ffe9a7;
    }

    .book-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 11px 0 #b38f2e, 0 0 35px #ffd966;
      background: #ffe28c;
    }

    .book-btn:active {
      transform: translateY(3px);
      box-shadow: 0 5px 0 #b38f2e, 0 0 25px #ffd966;
    }

    .book-btn i {
      font-size: 1.1rem;
    }

    /* toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e2538;
      border-left: 6px solid #ffd966;
      color: white;
      padding: 1rem 2rem;
      border-radius: 3rem;
      font-weight: 500;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 1rem;
      backdrop-filter: blur(8px);
      border: 1px solid #ffd96633;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .toast i {
      color: #ffd966;
      font-size: 1.3rem;
    }

    @media (max-width: 650px) {
      .booking-card {
        padding: 1.5rem 1rem;
      }

      h1 {
        font-size: 1.6rem;
      }

      .movie-showcase {
        flex-wrap: wrap;
      }

      .booking-footer {
        flex-direction: column;
        gap: 1.2rem;
        align-items: stretch;
      }

      .book-btn {
        justify-content: center;
      }

      .seat {
        width: 1.8rem;
        height: 1.8rem;
        font-size: 0.6rem;
      }
    }
  </style>
</head>
<body>

<div class="booking-card">
  <h1>
    <i class="fas fa-film"></i> CineVerse
  </h1>
  <div class="subhead">⚡ Book your seats in seconds — no queue, no hassle</div>

  <!-- movie info -->
  <div class="movie-showcase">
    <div class="poster">
      <i class="fas fa-clapperboard"></i>
    </div>
    <div class="movie-info">
      <h2>Dune: Part Two</h2>
      <div class="movie-meta">
        <span><i class="fas fa-clock"></i> 2h 46m</span>
        <span><i class="fas fa-tag"></i> Sci-Fi / Adventure</span>
      </div>
    </div>
    <div class="rating-badge">
      <i class="fas fa-star"></i> 8.8
    </div>
  </div>

  <!-- date selection -->
  <div class="section-title">
    <i class="fas fa-calendar-alt"></i> Select date
  </div>
  <div class="date-scroll" id="dateScroll">
    <!-- dynamic dates will be injected via js -->
  </div>

  <!-- time selection -->
  <div class="section-title">
    <i class="fas fa-clock"></i> Select showtime
  </div>
  <div class="time-scroll" id="timeScroll">
    <!-- dynamic times -->
  </div>

  <!-- screen & seats -->
  <div class="screen-area">
    <div class="screen"></div>
    <div class="screen-label">S C R E E N</div>
  </div>

  <div class="seats-grid" id="seatsGrid">
    <!-- rows generated by js -->
  </div>

  <!-- legend -->
  <div class="legend">
    <div class="legend-item"><div class="legend-box available"></div> Available</div>
    <div class="legend-item"><div class="legend-box selected"></div> Selected</div>
    <div class="legend-item"><div class="legend-box occupied"></div> Occupied</div>
  </div>

  <!-- footer summary -->
  <div class="booking-footer">
    <div class="summary">
      <div class="summary-item">
        <span class="summary-label">Seats</span>
        <span class="summary-value" id="selectedSeatsDisplay">0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">Total</span>
        <span class="summary-value" id="totalPriceDisplay">$0</span>
      </div>
    </div>
    <button class="book-btn" id="bookButton">
      <i class="fas fa-ticket-alt"></i> Book now
    </button>
  </div>
</div>

<!-- toast notification -->
<div class="toast" id="toast">
  <i class="fas fa-check-circle"></i>
  <span id="toastMessage">Booking confirmed!</span>
</div>

<script>
  (function() {
    // ---------- STATE ----------
    let selectedDate = null;
    let selectedTime = null;
    const selectedSeats = new Set(); // store seat ids like 'A1', 'B2'

    // Base price per seat
    const SEAT_PRICE = 12.5;

    // ---------- DOM ELEMENTS ----------
    const dateScroll = document.getElementById('dateScroll');
    const timeScroll = document.getElementById('timeScroll');
    const seatsGrid = document.getElementById('seatsGrid');
    const selectedSeatsDisplay = document.getElementById('selectedSeatsDisplay');
    const totalPriceDisplay = document.getElementById('totalPriceDisplay');
    const bookButton = document.getElementById('bookButton');
    const toast = document.getElementById('toast');
    const toastMessage = document.getElementById('toastMessage');

    // ---------- GENERATE DATES (next 7 days) ----------
    function generateDates() {
      const dates = [];
      const today = new Date();
      const weekdays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

      for (let i = 0; i < 7; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);
        const weekday = weekdays[d.getDay()];
        const day = d.getDate();
        const month = months[d.getMonth()];
        const fullDate = d.toISOString().split('T')[0];
        dates.push({ weekday, day, month, fullDate, dateObj: d });
      }
      return dates;
    }

    // ---------- RENDER DATE CARDS ----------
    function renderDates() {
      const dates = generateDates();
      dateScroll.innerHTML = '';
      // Set default selected date (first one)
      if (!selectedDate) selectedDate = dates[0].fullDate;

      dates.forEach((dateItem, index) => {
        const card = document.createElement('div');
        card.className = `date-card ${selectedDate === dateItem.fullDate ? 'active' : ''}`;
        card.dataset.date = dateItem.fullDate;
        card.innerHTML = `
          <div class="weekday">${dateItem.weekday}</div>
          <div class="day">${dateItem.day}</div>
          <div class="month">${dateItem.month}</div>
        `;
        card.addEventListener('click', () => {
          // update active class
          document.querySelectorAll('.date-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          selectedDate = dateItem.fullDate;
          // Reset selected seats when date changes? optional: keep seats, but better reset for demo consistency.
          // We'll keep seats but the times might change? let's just reset seats when date changes for realistic feel.
          resetSeats();
        });
        dateScroll.appendChild(card);
      });
    }

    // ---------- SHOWTIMES DATA ----------
    const showtimes = ['10:30 AM', '1:15 PM', '4:00 PM', '6:45 PM', '9:30 PM'];

    // ---------- RENDER TIME CARDS ----------
    function renderTimes() {
      timeScroll.innerHTML = '';
      // default selected time
      if (!selectedTime) selectedTime = showtimes[0];

      showtimes.forEach(time => {
        const card = document.createElement('div');
        card.className = `time-card ${selectedTime === time ? 'active' : ''}`;
        card.dataset.time = time;
        // add a tiny clock icon
        card.innerHTML = `<i class="fas fa-clock"></i> ${time}`;
        card.addEventListener('click', () => {
          document.querySelectorAll('.time-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          selectedTime = time;
          // reset seats when time changes (makes sense)
          resetSeats();
        });
        timeScroll.appendChild(card);
      });
    }

    // ---------- SEAT LAYOUT ----------
    // Rows A to H (8 rows), seats per row: 10 (A1..A10), with some occupied
    const rows = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
    const seatsPerRow = 10;

    // Pre-defined occupied seats (for realism)
    const occupiedSeats = new Set([
      'A3', 'A4', 'A9',
      'B2', 'B7', 'B8',
      'C1', 'C5', 'C6', 'C10',
      'D2', 'D4', 'D9',
      'E3', 'E7', 'E8',
      'F1', 'F6', 'F10',
      'G4', 'G5', 'G9',
      'H2', 'H3', 'H8'
    ]);

    // ---------- RENDER SEATS ----------
    function renderSeats() {
      seatsGrid.innerHTML = '';
      rows.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'seat-row';
        for (let i = 1; i <= seatsPerRow; i++) {
          const seatId = `${row}${i}`;
          const seat = document.createElement('div');
          seat.className = 'seat';
          seat.dataset.seatId = seatId;

          // check if occupied
          if (occupiedSeats.has(seatId)) {
            seat.classList.add('occupied');
            seat.innerHTML = '<i class="fas fa-times-circle"></i>';
          } else {
            seat.classList.add('available');
            // show seat number? use a simple dot or the letter+number for clarity but small
            // we'll show the number only (i) for minimalism, but can show both
            seat.innerHTML = `<i class="fas fa-chair"></i>`;
            // add click listener
            seat.addEventListener('click', () => toggleSeat(seat, seatId));
          }

          // if already selected (e.g. after reset? keep selected state if any)
          if (selectedSeats.has(seatId)) {
            seat.classList.add('selected');
            seat.classList.remove('available');
          }

          rowDiv.appendChild(seat);
        }
        seatsGrid.appendChild(rowDiv);
      });
      updateSummary();
    }

    // ---------- TOGGLE SEAT SELECTION ----------
    function toggleSeat(seatElement, seatId) {
      if (seatElement.classList.contains('occupied')) return;

      if (selectedSeats.has(seatId)) {
        // deselect
        selectedSeats.delete(seatId);
        seatElement.classList.remove('selected');
        seatElement.classList.add('available');
      } else {
        // select (max 8 seats for sanity)
        if (selectedSeats.size >= 8) {
          showToast('You can select up to 8 seats', 'fa-exclamation-circle');
          return;
        }
        selectedSeats.add(seatId);
        seatElement.classList.add('selected');
        seatElement.classList.remove('available');
      }
      updateSummary();
    }

    // ---------- UPDATE SUMMARY (seats count & total price) ----------
    function updateSummary() {
      const count = selectedSeats.size;
      selectedSeatsDisplay.textContent = count;
      const total = (count * SEAT_PRICE).toFixed(2);
      totalPriceDisplay.textContent = `$${total}`;
      // also update button text maybe
      if (count > 0) {
        bookButton.innerHTML = `<i class="fas fa-ticket-alt"></i> Book ${count} seat${count > 1 ? 's' : ''}`;
      } else {
        bookButton.innerHTML = `<i class="fas fa-ticket-alt"></i> Book now`;
      }
    }

    // ---------- RESET SEATS (on date/time change) ----------
    function resetSeats() {
      selectedSeats.clear();
      // re-render seats to clear selection and keep occupied as is
      renderSeats(); // this also updates summary
    }

    // ---------- SHOW TOAST MESSAGE ----------
    function showToast(message, icon = 'fa-check-circle') {
      toastMessage.textContent = message;
      const iconElem = toast.querySelector('i');
      iconElem.className = `fas ${icon}`;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2800);
    }

    // ---------- BOOK BUTTON HANDLER ----------
    function handleBooking() {
      if (selectedSeats.size === 0) {
        showToast('Please select at least one seat', 'fa-exclamation-triangle');
        return;
      }
      // simulate booking success
      const seatList = Array.from(selectedSeats).join(', ');
      const total = (selectedSeats.size * SEAT_PRICE).toFixed(2);
      showToast(`🎉 Booked ${selectedSeats.size} seat(s): ${seatList} | Total $${total}`, 'fa-check-circle');

      // Mark selected seats as occupied (so they become unavailable)
      selectedSeats.forEach(seatId => {
        occupiedSeats.add(seatId);
      });

      // Clear selectedSeats set
      selectedSeats.clear();
      // Re-render seats to reflect newly occupied seats
      renderSeats();

      // Optional: reset summary display (renderSeats calls updateSummary)
    }

    // ---------- INITIALIZATION ----------
    function init() {
      renderDates();
      renderTimes();
      renderSeats();
      updateSummary();

      // add event listener to book button
      bookButton.addEventListener('click', handleBooking);

      // Add a small UX: clicking outside does nothing, but we can add a welcome toast?
      setTimeout(() => {
        showToast('Pick a date, time & seats!', 'fa-film');
      }, 600);
    }

    init();
  })();
</script>
</body>
</html>
